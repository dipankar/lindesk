name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runner disks are small and the DuckDB/Vortex test binaries are huge with debug info
  # (the linker died with a bus error when the disk filled up).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # Core packages: no DuckDB/Vortex, quick to build. Telemetry ones build the bundled DuckDB.
  CORE: -p lindesk-plugin-api -p lindesk-plugin -p lindesk-core -p lindesk-host -p lindesk-builtins -p lindesk-sys -p lindesk-ipc -p lindesk-changes -p lindesk-version -p lindeskd -p lindesk-session -p lindeskctl -p lindesk-mcp -p lindesk-bench

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the toolchain; local builds and CI use the same one.
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus dbus-daemon xvfb python3 jq
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Python SDK tests
        run: python3 -m unittest discover -s sdk/python -p 'test_*.py'
      - name: Example plugins pass conformance
        run: |
          cargo build --locked -p lindeskctl
          for p in examples/plugins/*/*/plugin.toml; do
            ./target/debug/lindeskctl plugin test "$(dirname "$p")"
          done
      - name: doctor and version smoke test
        run: |
          ./target/debug/lindeskctl --version
          # doctor exits 1 when something needs action (nothing is installed on a runner).
          ./target/debug/lindeskctl doctor || true
          ./target/debug/lindeskctl doctor --json > doctor.json || true
          jq -e '.needs_action != null and .requirements != null' doctor.json >/dev/null

  core-is-lean:
    name: core links no DuckDB/Vortex
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # docs/ARCHITECTURE.md, "Cargo feature hygiene": only lindesk-data and
      # lindesk-telemetry-sink may link the telemetry stack.
      - run: |
          for p in lindeskd lindesk-session lindeskctl lindesk-mcp lindesk-bench; do
            if cargo tree --locked -e normal -p "$p" --prefix none |
              grep -E '^(duckdb|libduckdb-sys|vortex|vortex-[a-z-]+|arrow-[a-z]+|parquet|lindesk-store|lindesk-query) v'; then
              echo "::error::$p depends on telemetry-only crates"; exit 1
            fi
          done

  msrv:
    name: MSRV (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the MSRV toolchain from Cargo.toml
        run: |
          msrv=$(awk -F'"' '/^rust-version/ {print $2; exit}' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo +"$MSRV" check --locked $CORE

  stable-latest:
    name: latest stable (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Shows what the next toolchain bump will flag; never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable
      - run: cargo +stable clippy --locked $CORE --all-targets -- -D warnings

  deny:
    name: licences + advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  packages:
    name: packages (deb, rpm, arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [lint]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Lint packaging scripts
        run: |
          shellcheck packaging/install.sh packaging/uninstall.sh packaging/build-packages.sh packaging/check-layout.sh \
            packaging/runit/lindeskd/run packaging/runit/lindeskd/finish packaging/openrc/lindeskd scripts/release.sh
          shellcheck -s sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm \
            packaging/debian/telemetry/postinst packaging/debian/telemetry/prerm packaging/debian/telemetry/postrm
          shellcheck -s bash packaging/aur/lindesk.install packaging/aur/lindesk-telemetry.install
      - name: install.sh layout, idempotency and uninstall
        run: ./packaging/check-layout.sh
      # Build once on the runner; every package format stages these binaries through install.sh.
      - name: Release binaries (core, then telemetry)
        run: |
          export LINDESK_GIT_HASH="${GITHUB_SHA::7}"
          cargo build --release --locked -p lindeskd -p lindesk-session -p lindeskctl -p lindesk-bench -p lindesk-mcp
          cargo build --release --locked -p lindesk-data -p lindesk-telemetry-sink
          ls -l target/release/lindesk*
          ./target/release/lindeskctl --version
      - name: Build .deb
        run: LINDESK_BIN_DIR=target/release ./packaging/build-packages.sh deb
      - name: Build RPM in Fedora
        run: docker run --rm -v "$PWD":/src -w /src -e LINDESK_BIN_DIR=/src/target/release fedora:latest ./packaging/build-packages.sh rpm
      - name: Build Arch package
        run: docker run --rm -v "$PWD":/src -w /src -e LINDESK_BIN_DIR=/src/target/release archlinux:latest ./packaging/build-packages.sh arch
      - name: Man pages are in the packages
        # Checked here: minimal container images drop /usr/share/man on install.
        run: |
          dpkg-deb -c dist/lindesk_*.deb | grep -q 'man1/lindesk-mcp.1.gz'
          dpkg-deb -c dist/lindesk_*.deb | grep -q 'man8/lindeskd.8.gz'
          dpkg-deb -c dist/lindesk-telemetry_*.deb | grep -q 'man1/lindesk-data.1.gz'
      - name: Install core, add and remove telemetry, purge (.deb in Ubuntu)
        run: |
          docker run --rm -v "$PWD/dist":/dist:ro ubuntu:24.04 sh -euxc '
            apt-get update -qq
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y -qq /dist/lindesk_*.deb
            lindeskctl --version
            lindesk-mcp --help >/dev/null
            getent group lindesk
            test -d /var/lib/lindesk/changes
            test -f /usr/share/lindesk/profiles.d/00-balanced.toml
            test -f /usr/lib/systemd/user/lindesk-mcp.socket
            test ! -e /usr/bin/lindesk-data
            lindeskctl profile list --json >/dev/null
            if lindeskctl query "select 1" 2>err; then exit 1; fi
            grep -q "telemetry isn.t installed" err
            lindeskctl doctor | grep -q "not installed"
            apt-get install -y -qq /dist/lindesk-telemetry_*.deb
            test -x /usr/lib/lindesk/lindesk-telemetry-sink
            test -f /usr/lib/lindesk/plugins/telemetry/plugin.toml
            test -f /usr/lib/lindesk/plugins/telemetry-user/plugin.toml
            test -d /var/lib/lindesk/telemetry
            lindeskctl query --backend native "select 1 as x" | grep -q 1
            lindeskctl plugin list --system --all | grep -q telemetry
            apt-get remove -y -qq lindesk-telemetry
            test ! -e /usr/bin/lindesk-data
            test -x /usr/bin/lindeskd
            apt-get purge -y -qq lindesk
            test ! -e /usr/bin/lindeskd'
      - name: Install and remove the RPM in Fedora
        run: |
          docker run --rm -v "$PWD/dist":/dist:ro fedora:latest sh -euxc '
            dnf install -y -q $(ls /dist/lindesk-[0-9]*.rpm | grep -v src.rpm)
            lindeskctl --version
            lindesk-mcp --help >/dev/null
            getent group lindesk
            test -f /usr/share/lindesk/profiles.d/00-balanced.toml
            test ! -e /usr/bin/lindesk-data
            dnf install -y -q /dist/lindesk-telemetry-*.rpm
            test -x /usr/bin/lindesk-data
            test -f /usr/lib/lindesk/plugins/telemetry/plugin.toml
            dnf remove -y -q lindesk-telemetry lindesk
            test ! -e /usr/bin/lindeskd'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*
            dist/.SRCINFO
          retention-days: 14
