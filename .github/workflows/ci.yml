name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb python3 libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Python SDK tests
        run: python3 -m unittest discover -s sdk/python -p 'test_*.py'
      - name: Example plugins pass conformance
        run: |
          cargo build -p lindeskctl
          for p in examples/plugins/*/*/plugin.toml; do
            ./target/debug/lindeskctl plugin test "$(dirname "$p")"
          done
      - name: doctor smoke test
        run: cargo run -p lindeskctl -- doctor

  packages:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: ./packaging/build-packages.sh deb
      - name: Build RPM in Fedora
        run: docker run --rm -v "$PWD":/src -w /src fedora:latest ./packaging/build-packages.sh rpm
      - name: Build Arch package
        run: docker run --rm -v "$PWD":/src -w /src archlinux:latest ./packaging/build-packages.sh arch
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
