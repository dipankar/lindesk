name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb python3 libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Python SDK tests
        run: python3 -m unittest discover -s sdk/python -p 'test_*.py'
      - name: Example plugins pass conformance
        run: |
          cargo build -p lindeskctl
          for p in examples/plugins/*/*/plugin.toml; do
            ./target/debug/lindeskctl plugin test "$(dirname "$p")"
          done
      - name: doctor smoke test
        run: cargo run -p lindeskctl -- doctor

  packages:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lint packaging scripts
        run: |
          shellcheck packaging/install.sh packaging/build-packages.sh packaging/check-layout.sh \
            packaging/runit/lindeskd/run packaging/runit/lindeskd/finish packaging/openrc/lindeskd
          shellcheck -s sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
          shellcheck -s bash packaging/aur/lindesk.install
      - name: install.sh layout, idempotency and uninstall
        run: ./packaging/check-layout.sh
      # Build once on the runner; every package format stages these binaries through
      # install.sh. (Drop LINDESK_BIN_DIR to compile inside the Fedora/Arch containers.)
      - name: Release binaries
        run: cargo build --release --locked -p lindeskd -p lindesk-session -p lindeskctl -p lindesk-data -p lindesk-bench
      - name: Build .deb
        run: LINDESK_BIN_DIR=target/release ./packaging/build-packages.sh deb
      - name: Build RPM in Fedora
        run: docker run --rm -v "$PWD":/src -w /src -e LINDESK_BIN_DIR=/src/target/release fedora:latest ./packaging/build-packages.sh rpm
      - name: Build Arch package
        run: docker run --rm -v "$PWD":/src -w /src -e LINDESK_BIN_DIR=/src/target/release archlinux:latest ./packaging/build-packages.sh arch
      - name: Install and remove the .deb in Ubuntu
        run: |
          docker run --rm -v "$PWD/dist":/dist:ro ubuntu:24.04 sh -euxc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/lindesk_*.deb
            lindeskctl --help >/dev/null
            getent group lindesk
            test -d /var/lib/lindesk/telemetry
            apt-get purge -y -qq lindesk
            test ! -e /usr/bin/lindeskd'
      - name: Install and remove the RPM in Fedora
        run: |
          docker run --rm -v "$PWD/dist":/dist:ro fedora:latest sh -euxc '
            dnf install -y -q $(ls /dist/lindesk-*.rpm | grep -v src.rpm)
            lindeskctl --help >/dev/null
            getent group lindesk
            dnf remove -y -q lindesk
            test ! -e /usr/bin/lindeskd'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*
            dist/.SRCINFO
