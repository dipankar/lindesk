name: Release

# Tag `vX.Y.Z` (created by scripts/release.sh) → binaries and packages for x86_64 and
# aarch64, SHA256SUMS and a GitHub Release with that version's CHANGELOG section.
# `workflow_dispatch` with dry_run=true builds everything and creates a *draft* release.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything and create a draft release (nothing is published)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.arch }}
      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(awk -F'"' '/^\[workspace.package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::Cargo.toml says $v but the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Release binaries
        run: |
          export LINDESK_GIT_HASH="${GITHUB_SHA::7}"
          cargo build --release --locked -p lindeskd -p lindesk-session -p lindeskctl -p lindesk-bench -p lindesk-mcp
          cargo build --release --locked -p lindesk-data -p lindesk-telemetry-sink
          ./target/release/lindeskctl --version
      - name: .deb (core and telemetry)
        run: LINDESK_BIN_DIR=target/release ./packaging/build-packages.sh deb
      - name: RPM (Fedora)
        run: docker run --rm -v "$PWD":/src -w /src -e LINDESK_BIN_DIR=/src/target/release fedora:latest ./packaging/build-packages.sh rpm
      - name: Arch package
        # Arch Linux proper is x86_64 only.
        if: matrix.arch == 'x86_64'
        run: docker run --rm -v "$PWD":/src -w /src -e LINDESK_BIN_DIR=/src/target/release archlinux:latest ./packaging/build-packages.sh arch
      - name: Binary tarballs
        run: |
          v=$(awk -F'"' '/^\[workspace.package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          core=lindesk-$v-linux-${{ matrix.arch }}
          tele=lindesk-telemetry-$v-linux-${{ matrix.arch }}
          mkdir -p "stage/$core" "stage/$tele"
          cp target/release/{lindeskd,lindesk-session,lindeskctl,lindesk-bench,lindesk-mcp} "stage/$core/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "stage/$core/"
          cp target/release/{lindesk-data,lindesk-telemetry-sink} "stage/$tele/"
          cp LICENSE-MIT LICENSE-APACHE "stage/$tele/"
          tar -C stage --zstd -cf "dist/$core.tar.zst" "$core"
          tar -C stage --zstd -cf "dist/$tele.tar.zst" "$tele"
          sudo chown -R "$(id -u)" dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.zst
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd dist
          rm -f ./*.src.rpm
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          v=$(awk -F'"' '/^\[workspace.package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # This version's section of CHANGELOG.md (or Unreleased for a dry run).
          awk -v v="$v" '
            /^## / { on = ($0 ~ "^## \\[?" v "\\]?") || (!found && $0 ~ /^## \[?Unreleased/); if (on) found = 1; next }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "lindesk $v" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="dry-run-v$VERSION-${GITHUB_SHA::7}"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" dist/* --draft --prerelease --target "$GITHUB_SHA" \
              --title "lindesk $VERSION (dry run ${GITHUB_SHA::7})" --notes-file notes.md
          else
            pre=""
            case "$GITHUB_REF_NAME" in *-rc*|*-beta*|*-alpha*) pre="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* $pre --verify-tag \
              --title "lindesk $VERSION" --notes-file notes.md
          fi
