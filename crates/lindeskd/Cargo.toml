[package]
name = "lindeskd"
description = "lindesk privileged broker daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["mimalloc"]
# Use mimalloc instead of the system allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
lindesk-version.workspace = true
lindesk-plugin-api.workspace = true
lindesk-core.workspace = true
lindesk-host.workspace = true
lindesk-builtins.workspace = true
lindesk-sys.workspace = true
lindesk-ipc.workspace = true
lindesk-changes.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
zbus.workspace = true
rustix.workspace = true
sd-notify.workspace = true
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
lindesk-sys = { workspace = true, features = ["fixtures"] }
tempfile.workspace = true
