[package]
name = "lindeskctl"
description = "lindesk command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["mimalloc"]
# Use mimalloc instead of the system allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
lindesk-version.workspace = true
lindesk-plugin-api.workspace = true
lindesk-core.workspace = true
lindesk-host.workspace = true
lindesk-sys.workspace = true
lindesk-ipc.workspace = true
lindesk-changes.workspace = true
# Only the threshold policy is needed (simulate's baseline); skip the desktop adapters.
lindesk-builtins = { path = "../lindesk-builtins", version = "0.1.0", default-features = false }
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit = "0.25"
humantime.workspace = true
bytesize.workspace = true
chrono.workspace = true
libc.workspace = true
zbus = { workspace = true, features = ["blocking-api"] }
# `watch`: full-screen live view.
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
lindesk-sys = { workspace = true, features = ["fixtures"] }
# Only to write a small lake for the query/data end-to-end test (which runs the
# workspace's lindesk-data); never linked into lindeskctl.
lindesk-store.workspace = true
tempfile.workspace = true
