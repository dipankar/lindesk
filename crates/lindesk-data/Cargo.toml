[package]
name = "lindesk-data"
description = "lindesk telemetry lake tool: query, export/import, compaction, rollups, retention (DuckDB + Vortex)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["mimalloc"]
# Use mimalloc instead of the system allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
lindesk-version.workspace = true
lindesk-query.workspace = true
lindesk-core.workspace = true
lindesk-store.workspace = true
anyhow.workspace = true
clap.workspace = true
humantime.workspace = true
bytesize.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
lindesk-plugin-api.workspace = true
tempfile.workspace = true
