[package]
name = "lindesk-bench"
description = "lindesk foreground latency probe and A/B torture harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["mimalloc"]
# Use mimalloc instead of the system allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
lindesk-version.workspace = true
lindesk-plugin-api.workspace = true
lindesk-sys.workspace = true
lindesk-ipc.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
chrono.workspace = true
humantime.workspace = true
ulid.workspace = true
zbus.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tempfile.workspace = true
