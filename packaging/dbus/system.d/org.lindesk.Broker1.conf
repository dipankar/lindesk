<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.lindesk.Broker1"/>
    <allow send_destination="org.lindesk.Broker1"/>
  </policy>
  <!-- Everyone may talk to the broker; authorization happens per method via polkit
       and caller credentials (see org.lindesk.policy). -->
  <policy context="default">
    <allow send_destination="org.lindesk.Broker1" send_interface="org.lindesk.Broker1"/>
    <allow send_destination="org.lindesk.Broker1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.lindesk.Broker1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.lindesk.Broker1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
