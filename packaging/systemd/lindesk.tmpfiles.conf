d /var/lib/lindesk 0750 root lindesk -
d /var/lib/lindesk/telemetry 0750 root lindesk -
# Versioned changesets (lindeskctl changes / MCP); records are 0600 root.
d /var/lib/lindesk/changes 0750 root lindesk -
d /etc/lindesk/rules.d 0755 root root -
d /etc/lindesk/plugins 0755 root root -
d /etc/lindesk/profiles.d 0755 root root -
