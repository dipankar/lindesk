# Performance hints for hybrid x86 CPUs. Uclamp is not a CPU-time quota or core
# affinity: placement requires scheduler support and frequency effects depend on
# the cpufreq driver/governor. Detecting hybrid hardware alone does not verify either.
# CPU weights remain useful regardless of whether placement hints are effective.

[profile]
name = "x86-hybrid"
description = "x86 hybrid CPUs: bounded foreground/background performance hints via uclamp"

[match]
arch = ["x86_64"]
hybrid = true
# Same tier as arm-eas; below gaming, battery and hdd.
priority = 30

[config.plugins.threshold.config.values]
# Request more performance for input bursts; this does not force P-core placement.
fg_epoch_uclamp_min = 40.0
# Request lower performance for background work where supported.
yellow_batch_uclamp_max = 30.0
yellow_background_uclamp_max = 50.0
