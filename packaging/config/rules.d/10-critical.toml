# lindesk rules: critical workloads. These are boosted and never throttled.
#
# The kernel truncates comm to 15 bytes, so long names are matched by their truncated form
# too (e.g. gnome-session-binary → "gnome-session-b", xdg-desktop-portal-gnome →
# "xdg-desktop-por").

[[rule]]
name = "compositors"
class = "critical"
comm = [
  "gnome-shell",
  "mutter",
  "kwin_wayland",
  "kwin_x11",
  "plasmashell",
  "cosmic-comp",
  "cosmic-panel",
  "cosmic-session",
  "Xwayland",
  "Xorg",
  "sway",
  "Hyprland",
  "niri",
  "river",
  "labwc",
  "wayfire",
  # Desktop shells drawn by a separate process: Omarchy's bar, launcher and lock screen
  # (Quickshell), and the usual wlroots bar.
  "quickshell",
  "qs",
  "waybar",
]

# uwsm (Omarchy and other Hyprland, sway and niri setups) runs the compositor as this unit,
# and whatever the compositor starts directly (a shell, a bar) lives in it too.
[[rule]]
name = "compositor-units"
class = "critical"
unit = ["wayland-wm@*.service"]

[[rule]]
name = "audio"
class = "critical"
comm = ["pipewire", "pipewire-pulse", "wireplumber", "pulseaudio"]

[[rule]]
name = "portals"
class = "critical"
comm = ["xdg-desktop-por*"]

[[rule]]
name = "input-methods"
class = "critical"
comm = ["ibus-daemon", "fcitx5"]

[[rule]]
name = "session"
class = "critical"
comm = ["gnome-session-binary", "gnome-session-b", "dbus-broker", "dbus-broker-lau*", "dbus-daemon"]

# Nearly every service writes its log to journald and waits for it to take the line. When
# journald is starved of disk, they all stall with it, the desktop's own services included.
[[rule]]
name = "logging"
class = "critical"
comm = ["systemd-journal"]

[[rule]]
name = "accessibility"
class = "critical"
comm = ["at-spi*"]
